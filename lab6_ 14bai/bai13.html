<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài 13 - Chuyển đổi nhiệt độ</title>
</head>
<body>
  <h2>Bài 13. Chuyển đổi nhiệt độ</h2>
  <input type="number" id="doC" placeholder="Nhập nhiệt độ (°C)">
  <button onclick="chuyenDoi()">Chuyển đổi</button>
  <p id="ketqua"></p>

  <script>
    function chuyenDoi() {
      var c = Number(document.getElementById("doC").value);
      var f = (9 / 5) * c + 32;

      document.getElementById("ketqua").innerText = c + "°C = " + f + "°F";
    }
  </script>
</body>
</html>
