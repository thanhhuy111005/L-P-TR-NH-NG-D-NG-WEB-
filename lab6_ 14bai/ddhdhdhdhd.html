<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile cá nhân</title>
  <style>
    body {
      margin: 0;
      background-color: #eef2f0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: #26332f;
    }

    .card {
      width: 350px;
      max-width: 100%;
      box-sizing: border-box;
      margin: 50px auto;
      padding: 30px 24px;
      border: 2px solid #1f6f5c;
      border-radius: 16px;
      background-color: #ffffff;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border: 4px solid #1f6f5c;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 16px;
      display: block;
      background-color: #d8ebe5;
    }

    .name {
      margin: 0 0 6px;
      font-size: 28px;
      color: #1b2a26;
    }

    .job {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 600;
      color: #1f6f5c;
    }

    .intro {
      margin: 0 0 20px;
      font-size: 15px;
      line-height: 1.6;
      color: #4a5a55;
    }

    .skills-title {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .skills {
      list-style: none;
      margin: 0 0 24px;
      padding: 0;
    }

    .skills li {
      display: inline-block;
      margin: 4px 3px;
      padding: 6px 14px;
      border-radius: 8px;
      background-color: #d8ebe5;
      color: #14493c;
      font-size: 14px;
    }

    .btn {
      display: inline-block;
      padding: 10px 32px;
      border-radius: 8px;
      background-color: #1f6f5c;
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.25s;
    }

    .btn:hover {
      background-color: #e07a2f;
    }
  </style>
</head>
<body>

  <div class="card">
    <img class="avatar" alt="Ảnh đại diện"
         src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><circle cx='60' cy='46' r='22' fill='%231f6f5c'/><path d='M16 120c0-28 20-46 44-46s44 18 44 46z' fill='%231f6f5c'/></svg>">

    <h1 class="name">Phan Thanh Huy</h1>
    <p class="job">Sinh viên Lập trình Web</p>

    <p class="intro">
      Hé lô, mình là Huy.
    </p>

    <h2 class="skills-title">Kỹ năng</h2>
    <ul class="skills">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>Git</li>
    </ul>

    <a class="btn" href="mailto:email@example.com">Liên hệ</a>
  </div>

</body>
</html>
