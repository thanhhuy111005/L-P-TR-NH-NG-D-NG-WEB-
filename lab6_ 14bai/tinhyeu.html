<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bói Tình Yêu</title>
</head>
<body>
    <label for="tenban">Nhap ten ban</label>
    <input type="text" id="tenban">
    <br>
    <label for="tennguoiay">Nhap ten nguoi ay</label>
    <input type="text" id="tennguoiay">
    <br><br>
    
    <!-- 1. Thêm onclick="tinhTinhYeu()" để gọi hàm khi bấm nút -->
    <button onclick="tinhTinhYeu()">Xem ket qua</button>
    <h3 id="ketqua"></h3>

    <script>
        function tinhTinhYeu() {
            let tenBan = document.getElementById("tenban").value;
            let tenNguoiAy = document.getElementById("tennguoiay").value;
            
            // Tính điểm ngẫu nhiên từ 1 đến 100
            let diem = Math.floor(Math.random() * 100) + 1;
            
            if (diem > 50) {
                document.getElementById("ketqua").innerHTML = 
                    tenBan + " và " + tenNguoiAy + " hợp nhau " + diem + "%! 30000000000000000!";
            } else {
                document.getElementById("ketqua").innerHTML = 
                    tenBan + " và " + tenNguoiAy + " chỉ hợp nhau " + diem + "%. lốp dự phòng !";
            }
        }
    </script>
</body>
</html>
