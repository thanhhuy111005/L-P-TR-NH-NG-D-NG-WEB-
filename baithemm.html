<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
       
        body {
            font-family: Arial, sans-serif;
            background-image: url('anhnen.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.95); 
            padding: 25px 30px;
            border: 1px solid #ccc;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        h2 {
            font-family: "Times New Roman", Times, serif;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #111;
        }

        .form-row {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .form-row label {
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
            color: #111;
        }

        .form-row input[type="text"],
        .form-row input[type="email"],
        .form-row input[type="password"],
        .form-row input[type="number"] {
            padding: 3px 5px;
            border: 1px solid #767676;
            margin-left: 5px;
            background-color: #fff;
        }

        /* Nhóm radio và checkbox xếp hàng dọc */
        .vertical-group {
            margin-bottom: 12px;
        }

        .vertical-group .group-title {
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #111;
        }

        .option-item {
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            color: #111;
        }

        .option-item input {
            margin-left: 8px;
            cursor: pointer;
        }

        .select-row {
            margin-bottom: 12px;
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            font-weight: bold;
            color: #111;
        }

        .select-row select {
            font-size: 14px;
            padding: 2px 5px;
            margin-left: 5px;
            background-color: #fff;
            border: 1px solid #767676;
        }

        .bio-section {
            margin-bottom: 15px;
        }

        textarea {
            width: 260px;
            height: 100px;
            padding: 5px;
            border: 1px solid #767676;
            font-family: monospace;
            resize: both;
            background-color: #fff;
        }

        .bio-label {
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
            color: #111;
        }

        /* Các nút bấm */
        .buttons {
            display: flex;
            gap: 5px;
        }

        .buttons input[type="reset"],
        .buttons input[type="submit"] {
            padding: 3px 10px;
            background-color: #efefef;
            border: 1px solid #767676;
            font-family: Arial, sans-serif;
            font-size: 13px;
            cursor: pointer;
        }

        .buttons input[type="reset"]:hover,
        .buttons input[type="submit"]:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Registration Form</h2>

        <form action="" method="post">
            <!-- First Name -->
            <div class="form-row">
                <label for="fname">First Name :</label>
                <input type="text" id="fname" name="fname" placeholder="Enter First Name">
            </div>

            <!-- Last Name -->
            <div class="form-row">
                <label for="lname">Last Name :</label>
                <input type="text" id="lname" name="lname" placeholder="Enter Last Name">
            </div>

            <!-- Email -->
            <div class="form-row">
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" placeholder="Enter Email Address">
            </div>

            <!-- Password -->
            <div class="form-row">
                <label for="password">Password :</label>
                <input type="password" id="password" name="password">
            </div>

            <!-- Gender -->
            <div class="vertical-group">
                <div class="group-title">Gender:</div>
                <div class="option-item">
                    Male <input type="radio" name="gender" value="male">
                </div>
                <div class="option-item">
                    Female <input type="radio" name="gender" value="female">
                </div>
                <div class="option-item">
                    Other <input type="radio" name="gender" value="other">
                </div>
            </div>

            <!-- Age -->
            <div class="form-row">
                <label for="age">Age :</label>
                <input type="number" id="age" name="age">
            </div>

            <!-- Preferences -->
            <div class="vertical-group">
                <div class="group-title">Preferences :</div>
                <div class="option-item">
                    Acrylic Painting <input type="checkbox" name="pref" value="acrylic">
                </div>
                <div class="option-item">
                    Oil Painting <input type="checkbox" name="pref" value="oil">
                </div>
                <div class="option-item">
                    Water Color Painting <input type="checkbox" name="pref" value="watercolor">
                </div>
            </div>

            <!-- Select Occupation -->
            <div class="select-row">
                <label for="occupation">Select Occupation</label>
                <select id="occupation" name="occupation">
                    <option value="student" selected>Student</option>
                    <option value="engineer">Engineer</option>
                    <option value="teacher">Teacher</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- Bio / Textarea -->
            <div class="bio-section">
                <textarea name="bio" placeholder="Share few lines about yourself..."></textarea>
                <div class="bio-label">Bio</div>
            </div>

            <!-- Buttons -->
            <div class="buttons">
                <input type="reset" value="RESET">
                <input type="submit" value="SUBMIT">
            </div>
        </form>
    </div>

</body>
</html>
