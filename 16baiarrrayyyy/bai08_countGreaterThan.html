<head>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Bài 8: countGreaterThan</h1>
  <p>Trả về số lượng phần tử trong mảng lớn hơn value.</p>
  <pre id="output"></pre>
  <a class="back" href="index.html">&larr; Danh sách bài</a>

  <script src="print.js"></script>
  <script>
    function countGreaterThan(arr, value) {
      var count = 0;
      for (var i = 0; i < arr.length; i++) {
        if (arr[i] > value) {
          count++;
        }
      }
      return count;
    }

    print(countGreaterThan([1, 5, 7, 2, 3], 3));   // 2
    print(countGreaterThan([2, 3, 1, -6, 8], 5));  // 1
    print(countGreaterThan([], 5));                // 0
  </script>
</body>
</html>
