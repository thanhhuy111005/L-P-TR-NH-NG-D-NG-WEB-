<body>
  <h1>Bài 16: findPairsWithSum</h1>
  <p>Trả về mảng các cặp số trong arr có tổng bằng sum.</p>
  <pre id="output"></pre>
  <a class="back" href="index.html">&larr; Danh sách bài</a>

  <script src="print.js"></script>
  <script>
    function findPairsWithSum(arr, sum) {
      var result = [];
      for (var i = 0; i < arr.length; i++) {
        for (var j = i + 1; j < arr.length; j++) {
          if (arr[i] + arr[j] === sum) {
            result.push([arr[i], arr[j]]);
          }
        }
      }
      return result;
    }

    print(findPairsWithSum([1, 2, 3, 4, 5], 5));  // [[1,4],[2,3]]
    print(findPairsWithSum([2, 4, 6, 8], 10));    // [[2,8],[4,6]]
    print(findPairsWithSum([1, 2, 3], 100));      // []
  </script>
</body>
