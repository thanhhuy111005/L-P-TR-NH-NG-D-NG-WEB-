<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <title>Bài 1: findMax</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Bài 1: findMax</h1>
  <p>Trả về số lớn nhất trong mảng (dùng vòng lặp for). Mảng rỗng trả về null.</p>
  <pre id="output"></pre>
  <a class="back" href="index.html">&larr; Danh sách bài</a>

  <script src="print.js"></script>
  <script>
    function findMax(arr) {
      if (arr.length === 0) return null;

      var max = arr[0];
      for (var i = 1; i < arr.length; i++) {
        if (arr[i] > max) {
          max = arr[i];
        }
      }
      return max;
    }

    print(findMax([1, 3, 5, 7, 9]));       // 9
    print(findMax([10, 20, 30, 40, 50]));  // 50
    print(findMax([-5, -2, -1, -3]));      // -1
  </script>
</body>
</html>
