<body>
  <h1>Bài 10: sumOfSquares</h1>
  <p>Trả về tổng bình phương của mỗi số trong mảng.</p>
  <pre id="output"></pre>
  <a class="back" href="index.html">&larr; Danh sách bài</a>

  <script src="print.js"></script>
  <script>
    function sumOfSquares(arr) {
      var sum = 0;
      for (var i = 0; i < arr.length; i++) {
        sum += arr[i] * arr[i];
      }
      return sum;
    }

    print(sumOfSquares([1, 2, 3])); // 14
    print(sumOfSquares([4, 5, 6])); // 77
  </script>
</body>
