<body>
  <h1>Bài 7: isAscending</h1>
  <p>Kiểm tra mảng có tăng dần không. Mảng rỗng hoặc chỉ có một phần tử không được coi là tăng dần.</p>
  <pre id="output"></pre>
  <a class="back" href="index.html">&larr; Danh sách bài</a>

  <script src="print.js"></script>
  <script>
    function isAscending(arr) {
      if (arr.length < 2) return false;

      for (var i = 1; i < arr.length; i++) {
        if (arr[i] <= arr[i - 1]) {
          return false;
        }
      }
      return true;
    }

    print(isAscending([1, 2, 3, 5])); // true
    print(isAscending([1, 3, 2, 5])); // false
    print(isAscending([7]));          // false
    print(isAscending([]));           // false
  </script>
</body>
</html>
