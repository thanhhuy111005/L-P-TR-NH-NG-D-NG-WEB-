<body>
  <h1>Bài 2: sumOddNumbers</h1>
  <p>Trả về tổng của tất cả các số lẻ trong mảng (dùng vòng lặp for).</p>
  <pre id="output"></pre>
  <a class="back" href="index.html">&larr; Danh sách bài</a>

  <script src="print.js"></script>
  <script>
    function sumOddNumbers(arr) {
      var sum = 0;
      for (var i = 0; i < arr.length; i++) {
        if (arr[i] % 2 !== 0) {
          sum += arr[i];
        }
      }
      return sum;
    }

    print(sumOddNumbers([1, 2, 3, 4, 5])); // 9
  </script>
